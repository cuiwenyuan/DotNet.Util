name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/DotNet.Util.sln

      # 关键：先独立 build，让全部 TFM（含 net10.0 / net4x）按依赖顺序真正编译出来。
      # 直接 `dotnet pack` 整个 solution 会在 net10.0 等 TFM 上因构建/TFM 顺序问题
      # 编不出 DLL，最终只报“to be packed was not found on disk”而藏住真实编译错误。
      - name: Build
        run: dotnet build src/DotNet.Util.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack src/DotNet.Util.sln -c Release --no-build -o ./artifacts

      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

      - name: Push symbols to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
